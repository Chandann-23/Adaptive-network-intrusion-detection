name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]

  # Allows manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Hub via git
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://Chandann-23:$HF_TOKEN@huggingface.co/spaces/Chandann-23/adaptive-nids
          git push hf main --force
